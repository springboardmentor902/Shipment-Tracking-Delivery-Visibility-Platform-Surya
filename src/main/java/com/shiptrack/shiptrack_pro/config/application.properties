spring.application.name=shiptrack-pro

server.port=1022

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/Trackship_db
spring.datasource.username=postgres
spring.datasource.password=manager
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=ShipTrackProSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong
jwt.expiration=600000

# Google Maps API Configuration
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Brevo SMTP Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER:suryalbrcem9@gmail.com}
spring.mail.password=${SENDINBLUE_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

brevo.sender.email=suryalbrcem9@gmail.com
brevo.sender.name=ShipTrack Pro
