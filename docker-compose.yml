version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trackship-postgres
    restart: always
    environment:
      POSTGRES_DB: Trackship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackship-backend
    restart: always
    ports:
      - "1022:1022"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Trackship_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackship-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
